<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Store-listing size of icon.svg. Same mark, same palette, same framing. -->
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="128" fill="#141724" />

  <!-- The 24x24 source glyph, scaled 16x and centred with a 64px margin. -->
  <g transform="translate(64 64) scale(16)" fill="url(#logoGrad)">
    <!-- Text cursor I-beam -->
    <path d="M4 4h4v1.75H6.75v12.5H8V20H4v-1.75h1.25V5.75H4V4z" />
    <!-- Audio sound waves emanating from the cursor -->
    <rect x="9.5" y="8.5" width="2" height="7" rx="1" />
    <rect x="13" y="5" width="2" height="14" rx="1" />
    <rect x="16.5" y="3" width="2" height="18" rx="1" />
    <rect x="20" y="7" width="2" height="10" rx="1" />
  </g>
</svg>
