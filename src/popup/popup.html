<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Cursor</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="app" id="app">
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 9.5v5a1.5 1.5 0 0 0 1.5 1.5H8l4.3 3.44A1 1 0 0 0 14 18.66V5.34a1 1 0 0 0-1.7-.78L8 8H5.5A1.5 1.5 0 0 0 4 9.5z" fill="currentColor"/>
                        <path class="wave wave-1" d="M17 9.5a3.5 3.5 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        <path class="wave wave-2" d="M19 7a7 7 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>Audio Cursor</h1>
                    <span id="status-label">On</span>
                </div>
            </div>
            <label class="switch" title="Enable or disable Audio Cursor">
                <input type="checkbox" id="enabled-toggle">
                <span class="slider"></span>
            </label>
        </header>

        <main>
            <section class="card">
                <div class="card-label">Voice</div>
                <div class="custom-select" id="custom-voice-select">
                    <button class="select-trigger" id="voice-trigger" type="button">
                        <span id="selected-voice-label">System default</span>
                        <svg class="select-arrow" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M6 9.5l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <div class="select-options" id="voice-options"></div>
                </div>
                <select id="voice-select" hidden>
                    <option value="default">System default</option>
                </select>
            </section>

            <section class="card">
                <div class="control-row">
                    <div class="control-head">
                        <span class="card-label">Speed</span>
                        <span id="rate-value" class="readout">1.0×</span>
                    </div>
                    <input type="range" id="rate-range" min="0.5" max="2.0" step="0.1" value="1.0">
                </div>
                <div class="control-row">
                    <div class="control-head">
                        <span class="card-label">Pitch</span>
                        <span id="pitch-value" class="readout">1.0</span>
                    </div>
                    <input type="range" id="pitch-range" min="0" max="2.0" step="0.1" value="1.0">
                </div>
                <div class="control-row toggle-row">
                    <div class="control-head">
                        <span class="card-label">Repeat playback</span>
                    </div>
                    <label class="switch sm" title="Automatically repeat audio when playback finishes">
                        <input type="checkbox" id="repeat-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </section>

            <div class="btn-group">
                <button id="test-speech" class="preview-btn" type="button">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M8 5.5v13a1 1 0 0 0 1.52.86l10.2-6.5a1 1 0 0 0 0-1.72L9.52 4.64A1 1 0 0 0 8 5.5z" fill="currentColor"/>
                    </svg>
                    <span>Preview</span>
                </button>
                <button id="read-clipboard" class="preview-btn secondary" type="button" title="Speak copied text from clipboard (PDFs / Docs)">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 16H5V5h2v3h10V5h2v14z" fill="currentColor"/>
                    </svg>
                    <span>Read clipboard</span>
                </button>
            </div>

            <section class="card">
                <div class="card-label">Shortcuts</div>
                <div class="keybind-list" id="keybind-list"></div>
                <div class="keybind-note">
                    Select text while holding <b>Ctrl+Alt</b> to auto-play.<br>
                    Text cursor stays on until pressed again. Press text or use
                    <b>arrows</b> to move, <b>Shift</b> to select.
                </div>
            </section>
        </main>

        <footer>
            <span class="hint-text">Click a shortcut to remap</span>
            <button class="link-btn" id="keybind-reset" type="button">Reset</button>
        </footer>
    </div>
    <script src="popup.js"></script>
</body>
</html>
