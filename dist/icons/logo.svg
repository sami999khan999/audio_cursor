      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Clean Matte Squircle Container -->
  <rect width="512" height="512" rx="128" fill="#141724" />

